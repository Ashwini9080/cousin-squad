<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cousins Squad 💫</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-deep: #190d29;
      --bg-deep2: #2a1442;
      --pink: #FF2E93;
      --yellow: #FFD23F;
      --teal: #00F5D4;
      --orange: #FF7A45;
      --purple: #9D4EDD;
      --cream: #FFF7EE;
      --card-shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 18% 12%, var(--bg-deep2), var(--bg-deep) 65%);
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--cream);
      overflow-x: hidden;
      position: relative;
      padding-bottom: 50px;
      -webkit-font-smoothing: antialiased;
    }

    /* floating ambient blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.32;
      z-index: 0;
      animation: float 14s ease-in-out infinite;
    }

    .blob1 {
      width: 320px;
      height: 320px;
      background: var(--pink);
      top: -80px;
      left: -90px;
      animation-delay: 0s;
    }

    .blob2 {
      width: 260px;
      height: 260px;
      background: var(--teal);
      bottom: 0;
      right: -70px;
      animation-delay: 2s;
    }

    .blob3 {
      width: 240px;
      height: 240px;
      background: var(--yellow);
      bottom: 25%;
      left: 38%;
      animation-delay: 5s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) translateX(0) scale(1);
      }

      50% {
        transform: translateY(-35px) translateX(24px) scale(1.1);
      }
    }

    header {
      text-align: center;
      padding: 60px 20px 24px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      font-size: clamp(2.4rem, 7.5vw, 4.4rem);
      margin: 0 0 14px;
      line-height: 1.08;
      background: linear-gradient(95deg, var(--pink), var(--orange) 45%, var(--yellow));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transform: rotate(-1deg);
      opacity: 0;
      animation: fadeUp 0.7s ease 0.15s forwards;
      filter: drop-shadow(0 4px 16px rgba(255, 46, 147, 0.3));
    }

    .subtitle {
      font-size: 1.1rem;
      color: #D8C9EE;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.3s forwards;
    }

    .subtitle b {
      color: var(--yellow);
      font-weight: 700;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wall {
      position: relative;
      z-index: 2;
      max-width: 1240px;
      margin: 35px auto 20px;
      padding: 20px 24px 60px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 38px;
    }

    /* Tall, grand and spacious cards (380px height) */
    .card {
      width: 260px;
      height: 380px;
      perspective: 1400px;
      opacity: 0;
      animation: cardIn 0.6s ease forwards;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.65s cubic-bezier(.2, .9, .3, 1.2);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      backface-visibility: hidden;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 18px 40px var(--card-shadow);
    }

    .card-front {
      background: var(--card-color, var(--pink));
      color: #190d29;
    }

    .card-front .avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
    }

    .avatar-emoji {
      font-size: 4rem;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.18));
    }

    /* Large Circular Photo Frame (122px) */
    .avatar-frame {
      width: 122px;
      height: 122px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.96);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.38), 0 0 20px rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }

    .card:hover .avatar-frame {
      transform: scale(1.08) rotate(3deg);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-front .name {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      font-size: 1.65rem;
      margin: 6px 0 4px;
      letter-spacing: -0.3px;
      line-height: 1.1;
    }

    .card-front .tag {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      background: rgba(25, 13, 41, 0.16);
      padding: 6px 14px;
      border-radius: 24px;
      letter-spacing: 0.5px;
      font-weight: 700;
      line-height: 1.3;
    }

    .card-front .hint {
      font-size: 0.75rem;
      opacity: 0.7;
      font-family: 'Space Mono', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Card Back */
    .card-back {
      background: #25123b;
      border: 3px solid var(--card-color, var(--pink));
      transform: rotateY(180deg);
      color: var(--cream);
      padding: 30px 22px;
      justify-content: center;
      gap: 16px;
    }

    .card-back .msg-emoji {
      font-size: 2.8rem;
    }

    .card-back .msg-text {
      font-size: 1.05rem;
      line-height: 1.65;
      font-weight: 500;
    }

    .card-back .flip-back-hint {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--teal);
      margin-top: 8px;
      opacity: 0.85;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(28px) rotate(0deg);
      }

      to {
        opacity: 1;
        transform: translateY(0) rotate(var(--tilt, 0deg));
      }
    }

    .card:nth-child(1) {
      --tilt: -3deg;
      animation-delay: 0.1s;
    }

    .card:nth-child(2) {
      --tilt: 2deg;
      animation-delay: 0.22s;
    }

    .card:nth-child(3) {
      --tilt: -2deg;
      animation-delay: 0.34s;
    }

    .card:nth-child(4) {
      --tilt: 3deg;
      animation-delay: 0.46s;
    }

    .card:nth-child(5) {
      --tilt: -1deg;
      animation-delay: 0.58s;
    }

    .card:not(.flipped) .card-inner {
      transform: rotate(var(--tilt, 0deg));
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg) rotate(var(--tilt, 0deg));
    }

    .card:hover:not(.flipped) .card-inner {
      transform: rotate(0deg) scale(1.04) translateY(-8px);
    }

    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 15px 20px 50px;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      color: #9C8BB8;
    }

    footer span {
      color: var(--pink);
    }

    @media (prefers-reduced-motion: reduce) {

      .blob,
      h1,
      .subtitle,
      .card {
        animation: none !important;
        opacity: 1 !important;
      }
    }

    @media (max-width: 600px) {
      .card {
        width: 44vw;
        height: 320px;
      }

      .avatar-frame {
        width: 95px;
        height: 95px;
      }

      .card-front .name {
        font-size: 1.35rem;
      }

      .card-front .tag {
        font-size: 0.72rem;
        padding: 4px 10px;
      }

      .card-back {
        font-size: 0.88rem;
        padding: 20px 14px;
      }
    }
  </style>
</head>

<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <header>
    <h1>Hamara Cousin Squad 💫</h1>
    <p class="subtitle">Tap kisi bhi card pe — <b>ek secret masti fact</b> milega har cousin ke baare mein 👀</p>
  </header>

  <div class="wall" id="wall"></div>

  <footer>Made with <span>💜</span> by Ash — dobara flip karne ke liye card pe tap karo</footer>

  <script>
    const cousins = [
      {
        name: "Kushi",
        emoji: "💃",
        tag: "Har Cheez Ke Liye Ready 🌟",
        color: "#FF2E93",
        msgEmoji: "✨",
        msg: "Plan bana nahi ki Kushi sabse pehle tayyar! Outing ho, shopping ho, khana ho ya masti — har cheez ke liye 24/7 full ready rehti hai! 💃🔥",
        image: "kushi.jpg",
        imgPos: "center 46%",
        imgScale: 1.05
      },
      {
        name: "Muskan Dii",
        emoji: "👑",
        tag: "Selfie Queen & Supreme Court 📸",
        color: "#FFD23F",
        msgEmoji: "🤳",
        msg: "Phone ka storage sirf selfies se full hai! Har 2 minute mein 50 poses on, aur jo hukum ek baar chala diya uspe Supreme Court bhi appeal nahi le sakta! 👑🔥",
        image: "muskan.jpg",
        imgPos: "center 40%",
        imgScale: 1.2
      },
      {
        name: "Harsh",
        emoji: "🔥",
        tag: "Masoom Bhaichara & Yaaron Ka Yaar 🤝",
        color: "#FF7A45",
        msgEmoji: "🤦‍♂️",
        msg: "Dildaar itna ki dosto ke liye jaan haazir! Par koi bhi meethi baat karke 2 second mein bina soche samjhe bahkawe mein le aata hai! 🫂😂",
        image: "harsh.jpg",
        imgPos: "center 18%",
        imgScale: 1.15
      },
      {
        name: "Alka",
        emoji: "✨",
        tag: "Drama Queen & Cinema Package 🎬",
        color: "#00F5D4",
        msgEmoji: "🎭",
        msg: "Chhoti si baat pe pura Bollywood movie ka tragic climax ready! Chai thandi ho jaye toh lagta hai Karan Johar ka script shuru ho gaya! 🍿🌟",
        image: "alka.jpg",
        imgPos: "center 56%",
        imgScale: 1.05
      },
      {
        name: "Adarsh",
        emoji: "🎮",
        tag: "24/7 Gamer & High-Ping Bhai 🕹️",
        color: "#9D4EDD",
        msgEmoji: "🎮",
        msg: "Real world mein ek glass paani maango toh 'Ping 999+ aa raha hai' excuse, par game ke andar aadhi raat ko mic pe sabse loud voice! ⚡🔫",
        image: "adarsh.jpg",
        imgPos: "center 42%",
        imgScale: 1.05
      }
    ];

    const wall = document.getElementById('wall');

    // Render cards
    cousins.forEach((c) => {
      const card = document.createElement('div');
      card.className = 'card';

      const avatarHtml = c.image ? `
      <div class="avatar-frame">
        <img src="${c.image}" alt="${c.name}" class="avatar-img" style="object-position: ${c.imgPos || 'center 50%'}; transform: scale(${c.imgScale || 1});" onerror="this.parentElement.style.display='none'; this.parentElement.nextElementSibling.style.display='block';">
      </div>
      <div class="avatar-emoji" style="display:none;">${c.emoji}</div>
    ` : `<div class="avatar-emoji">${c.emoji}</div>`;

      card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front" style="--card-color:${c.color}">
          <div class="avatar">${avatarHtml}</div>
          <div>
            <div class="name">${c.name}</div>
            <div class="tag">${c.tag}</div>
          </div>
          <div class="hint">tap to reveal ➔</div>
        </div>
        <div class="card-face card-back" style="--card-color:${c.color}">
          <div class="msg-emoji">${c.msgEmoji}</div>
          <div class="msg-text">${c.msg}</div>
          <div class="flip-back-hint">tap to flip back ↩</div>
        </div>
      </div>
    `;

      card.addEventListener('click', () => {
        const wasFlipped = card.classList.contains('flipped');
        card.classList.toggle('flipped');

        if (!wasFlipped && typeof confetti === 'function') {
          const rect = card.getBoundingClientRect();
          confetti({
            particleCount: 55,
            spread: 65,
            startVelocity: 32,
            origin: {
              x: (rect.left + rect.width / 2) / window.innerWidth,
              y: (rect.top + rect.height / 2) / window.innerHeight
            },
            colors: [c.color, '#FFD23F', '#FFF7EE', '#FF2E93', '#00F5D4']
          });
        }
      });

      wall.appendChild(card);
    });
  </script>

</body>

</html>
